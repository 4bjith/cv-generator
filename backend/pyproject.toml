[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cv-maker-backend"
version = "0.1.0"
description = "FastAPI backend for AI CV Maker"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.11.0",
    "pydantic[email]>=2.10.0",
    "email-validator>=2.0.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.0.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pypdf>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
